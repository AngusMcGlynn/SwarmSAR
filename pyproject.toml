[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "swarmsar"
version = "0.1.0"
description = "Research-grade drone swarm coordination simulator for search and rescue"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pygame",
    "matplotlib",
    "scipy",
    "dataclasses-json",
    "pytest",
]

[project.optional-dependencies]
training = [
    "torch",
    "tensorboard",
]
analysis = [
    "pandas",
    "seaborn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
